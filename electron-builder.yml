appId: com.freewill.seedance
productName: Freewill Seedance
# ★ The executable FILENAME is pinned to the old one on purpose. Do not "tidy" it.
# productName drives the exe name by default, and renaming the exe silently breaks every
# shortcut the installer does not know about — above all TASKBAR PINS, which users create
# themselves and NSIS never tracks. Verified: after a rename the pinned .lnk still pointed
# at "Freewill Seedance 2.0.exe" and its target no longer existed.
# Splitting the two keeps every user-made shortcut working while the name people actually
# see — window title, tray, Start Menu, uninstall entry — drops the "2.0".
# Nobody reads the exe filename; everybody notices a dead taskbar icon.
executableName: Freewill Seedance 2.0
# ★ appId is FROZEN. electron-builder derives the NSIS upgrade GUID from it
#   (UUID.v5(appId) — verified against the live registry key 692f1479-3e76-5b20-9562-3e01b3da4a16).
#   Change appId and every installed copy becomes a SEPARATE app: no in-place upgrade,
#   two entries in Programs & Features. productName has zero influence on that GUID.
# ★ package.json `name` is also FROZEN — it is what app.getName() returns (productName is
#   NOT injected into the packaged package.json; verified by extracting it from app.asar),
#   so userData stays at %APPDATA%reewill-seedance and no user loses their projects.
copyright: Copyright (c) 2026 Freewill

directories:
  output: release
  buildResources: electron

files:
  - "dist/**/*"
  - "electron/main.cjs"
  - "electron/preload.cjs"
  - "electron/icon.png"
  - "public/**/*"
  - "node_modules/electron-updater/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/sax/**/*"
  - "node_modules/js-yaml/**/*"
  - "node_modules/argparse/**/*"
  - "node_modules/tiny-typed-emitter/**/*"
  - "!src"
  - "!temp-repo"

extraResources:
  - from: "dist-server/"
    to: "."
    filter:
      - "server.cjs"
  - from: "dist/"
    to: "dist"

# Pinned, and hyphenated. This name becomes the GitHub asset name — the one electron-updater
# fetches over HTTP — so it is kept free of spaces and of anything non-ASCII, independently of
# whatever productName happens to be. Renaming the app must never be able to reach the wire.
artifactName: Freewill-Seedance-Setup-${version}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Freewill Seedance

publish:
  provider: github
  owner: productionkhu-tech
  repo: freewill-seedance
  releaseType: release
